[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-interview-cfd-workflow"
version = "0.1.0"
description = "A short description of your project."
authors = [
    { name = "Joe Dirt", email = "joe.dirt@example.com" },
]
readme = "INSTRUCTIONS.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    # Add your runtime dependencies here, for example:
    # "requests >=2.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
